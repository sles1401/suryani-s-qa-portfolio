name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  performance:
    name: Performance budgets (Lighthouse + bundle size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Bundle size budget
        run: bun run perf:bundle
      - name: Lighthouse (light theme, all pages)
        run: bunx @lhci/cli@0.14.x autorun --config=lighthouserc.json
      - name: Lighthouse (dark theme, all pages)
        run: bunx @lhci/cli@0.14.x autorun --config=lighthouserc.dark.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci
            .lighthouseci-dark
          retention-days: 14

  vitest:
    name: Vitest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx vitest run

  playwright:
    name: Playwright + axe (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright suite (${{ matrix.browser }})
        run: bunx playwright test --project=${{ matrix.browser }}
        env:
          CI: "1"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 14
      - name: Upload Playwright failure artifacts (trace.zip, video, screenshots, diffs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: test-results
          retention-days: 14

  modal-cross-browser:
    name: Portfolio modal suite (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Firefox/WebKit binaries are not preinstalled on the runner image.
      - name: Install Playwright browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Run POM modal specs (${{ matrix.browser }})
        run: bunx playwright test --project=${{ matrix.browser }} e2e/pom-modal.*.spec.ts
        env:
          CI: "1"
      - name: Upload modal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 14
      - name: Upload modal failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modal-test-results-${{ matrix.browser }}
          path: test-results
          retention-days: 14

  stability-cross-browser:
    name: Stability / cursor / clock suite (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      # Pixel-snapshot specs stay Chromium-only (font/AA differences across
      # engines); everything below is functional/DOM/metric based.
      - name: Run modal stability + cursor a11y + LiveClock + social focus specs
        run: |
          bunx playwright test --project=${{ matrix.browser }} \
            e2e/pom-modal.cls-stability.themes.spec.ts \
            e2e/pom-modal.cycle-invariants.themes.spec.ts \
            e2e/custom-cursor.a11y.spec.ts \
            e2e/live-clock.spec.ts \
            e2e/social-links.focus.spec.ts
        env:
          CI: "1"
      - name: Upload stability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 14
      - name: Upload stability failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stability-test-results-${{ matrix.browser }}
          path: test-results
          retention-days: 14